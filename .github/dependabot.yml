version: 2
updates:
  # Root dev tooling (Husky, lint-staged, Biome, Turborepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - "dependencies"
      - "root"

  # Mastra AI agent backend
  - package-ecosystem: "npm"
    directory: "/apps/agents"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - "dependencies"
      - "agents"

  # Next.js frontend application
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    versioning-strategy: auto
    labels:
      - "dependencies"
      - "web"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "github-actions"
