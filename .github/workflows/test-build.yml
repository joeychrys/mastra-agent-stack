name: Test Build

# Manually triggered - builds Docker images without pushing or deploying
on:
  workflow_dispatch:

jobs:
  test-build-web:
    name: Docker Build - Web (Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/web/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  test-build-agents:
    name: Docker Build - Agents (Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/agents/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=agents
          cache-to: type=gha,mode=max,scope=agents
